<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">ClickHouse String JSON 与 Native JSON 处理流程</title>
  <desc id="desc">JSONEachRow 输入后，String JSON 保存文本；Native JSON 识别类型并按 type hint、dynamic subcolumn 与 shared data 组织。INSERT 生成可查询 part，后台 merge 或 OPTIMIZE FINAL 重写 part，SELECT FINAL 只影响读取。</desc>
  <defs>
    <style>
      .box { fill:#f7f9fc; stroke:#52657a; stroke-width:2; rx:8; }
      .string { fill:#eef6ff; stroke:#2f6f9f; stroke-width:2; rx:8; }
      .native { fill:#eef8f1; stroke:#397554; stroke-width:2; rx:8; }
      .merge { fill:#fff8e8; stroke:#9a7725; stroke-width:2; rx:8; }
      .text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; font-size:17px; fill:#1f2933; text-anchor:middle; }
      .small { font-size:14px; fill:#44515f; }
      .label { font-size:16px; font-weight:600; }
      .arrow { stroke:#52657a; stroke-width:2.1; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52657a"/></marker>
  </defs>

  <rect width="1280" height="650" fill="#ffffff"/>
  <text x="640" y="38" class="text" font-size="24" font-weight="700">ClickHouse String JSON 与 Native JSON：从输入到读取</text>

  <rect x="35" y="92" width="170" height="78" class="box"/>
  <text x="120" y="123" class="text label">JSONEachRow</text>
  <text x="120" y="148" class="text small">逐行 JSON 对象</text>
  <rect x="245" y="92" width="180" height="78" class="box"/>
  <text x="335" y="123" class="text label">JSON 解析</text>
  <text x="335" y="148" class="text small">识别列与输入值</text>
  <path d="M205 131 H245" class="arrow"/>

  <rect x="490" y="65" width="210" height="82" class="string"/>
  <text x="595" y="97" class="text label">ClickHouse String JSON</text>
  <text x="595" y="123" class="text small">压缩 String 文本</text>
  <path d="M425 116 C455 116,455 106,490 106" class="arrow"/>

  <rect x="490" y="188" width="210" height="82" class="native"/>
  <text x="595" y="220" class="text label">ClickHouse Native JSON</text>
  <text x="595" y="246" class="text small">路径和值类型识别</text>
  <path d="M425 145 C455 145,455 229,490 229" class="arrow"/>

  <rect x="755" y="52" width="205" height="68" class="native"/>
  <text x="857" y="80" class="text label">type hint 子列</text>
  <text x="857" y="103" class="text small">声明类型；不占预算</text>
  <rect x="755" y="145" width="205" height="68" class="native"/>
  <text x="857" y="173" class="text label">dynamic subcolumn</text>
  <text x="857" y="196" class="text small">预算内未提示路径</text>
  <rect x="755" y="238" width="205" height="68" class="native"/>
  <text x="857" y="266" class="text label">shared data</text>
  <text x="857" y="289" class="text small">预算外路径</text>
  <path d="M700 215 C725 215,725 86,755 86" class="arrow"/>
  <path d="M700 229 H755" class="arrow"/>
  <path d="M700 243 C725 243,725 272,755 272" class="arrow"/>

  <rect x="1030" y="123" width="205" height="100" class="box"/>
  <text x="1132" y="156" class="text label">不可变 data part</text>
  <text x="1132" y="183" class="text small">INSERT 生成 active part</text>
  <text x="1132" y="206" class="text small">生成后即可查询</text>
  <path d="M700 106 C995 106,995 151,1030 151" class="arrow"/>
  <path d="M960 86 C995 86,995 164,1030 164" class="arrow"/>
  <path d="M960 179 H1030" class="arrow"/>
  <path d="M960 272 C995 272,995 195,1030 195" class="arrow"/>

  <rect x="250" y="390" width="220" height="94" class="merge"/>
  <text x="360" y="422" class="text label">后台 merge</text>
  <text x="360" y="449" class="text small">源 part → 目标 part</text>
  <text x="360" y="472" class="text small">可重组 dynamic/shared</text>
  <rect x="530" y="390" width="220" height="94" class="merge"/>
  <text x="640" y="422" class="text label">OPTIMIZE ... FINAL</text>
  <text x="640" y="449" class="text small">强制物理合并</text>
  <text x="640" y="472" class="text small">重写 active part</text>
  <path d="M1132 223 V340 H360 V390" class="arrow"/>
  <path d="M1132 223 V340 H640 V390" class="arrow"/>

  <rect x="810" y="382" width="200" height="110" class="box"/>
  <text x="910" y="414" class="text label">读取</text>
  <text x="910" y="441" class="text small">路径子列或完整对象</text>
  <text x="910" y="464" class="text small">普通 SELECT</text>
  <text x="910" y="487" class="text small">SELECT ... FINAL</text>
  <path d="M470 437 H810" class="arrow"/>
  <path d="M750 437 H810" class="arrow"/>
  <path d="M1132 223 V330 H1010 V405" class="arrow"/>

  <rect x="1045" y="390" width="190" height="94" class="box"/>
  <text x="1140" y="422" class="text label">客户端结果</text>
  <text x="1140" y="449" class="text small">字段或完整 JSON</text>
  <text x="1140" y="472" class="text small">按语义校验</text>
  <path d="M1010 437 H1045" class="arrow"/>

  <text x="640" y="570" class="text small">max_dynamic_paths=32 约束单个 part 的未提示动态路径；多个 active parts 的路径并集可超过 32。</text>
  <text x="640" y="602" class="text small">SELECT ... FINAL 在读取阶段应用表引擎合并语义；OPTIMIZE TABLE ... FINAL 执行物理 part 合并。</text>
</svg>
