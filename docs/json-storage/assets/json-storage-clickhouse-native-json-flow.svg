<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ClickHouse String JSON 与 Native JSON 写入、合并和读取流程</title>
  <desc id="desc">图分为写入与物理组织、data part 合并、读取时 FINAL 三个区域，区分 String JSON 和 Native JSON，并说明 type hint、dynamic subcolumn、shared data 与路径预算。</desc>
  <defs>
    <style>
      .panel { fill:#fbfcfe; stroke:#d7dee8; stroke-width:1.5; }
      .box { fill:#f7f9fc; stroke:#52657a; stroke-width:2; }
      .string { fill:#eef6ff; stroke:#2f6f9f; stroke-width:2; }
      .native { fill:#eef8f1; stroke:#397554; stroke-width:2; }
      .merge { fill:#fff8e8; stroke:#9a7725; stroke-width:2; }
      .title { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:25px; font-weight:700; fill:#1f2933; text-anchor:middle; }
      .panel-title { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:18px; font-weight:700; fill:#334155; }
      .label { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:16px; font-weight:700; fill:#1f2933; text-anchor:middle; }
      .text { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:14px; fill:#44515f; text-anchor:middle; }
      .note { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:14px; fill:#44515f; }
      .arrow { stroke:#52657a; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .connector { stroke:#52657a; stroke-width:2.2; fill:none; }
      .branch { fill:#52657a; }
      .divider { stroke:#b8c4d2; stroke-width:1.4; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52657a"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="42" class="title">ClickHouse String JSON 与 Native JSON：写入、物理组织和读取</text>

  <rect x="25" y="70" width="1550" height="390" rx="12" class="panel"/>
  <text x="50" y="103" class="panel-title">A. JSONEachRow 写入与单个 data part 的物理组织</text>

  <rect x="50" y="190" width="175" height="90" rx="9" class="box"/>
  <text x="137" y="226" class="label">JSONEachRow</text>
  <text x="137" y="254" class="text">逐行 JSON 对象</text>
  <rect x="270" y="190" width="190" height="90" rx="9" class="box"/>
  <text x="365" y="226" class="label">输入解析</text>
  <text x="365" y="254" class="text">识别列和值</text>
  <path d="M225 235 H270" class="arrow"/>
  <circle cx="500" cy="235" r="5" class="branch"/>
  <path d="M460 235 H500" class="connector"/>

  <path d="M500 235 V142 H555" class="arrow"/>
  <rect x="555" y="100" width="235" height="84" rx="9" class="string"/>
  <text x="672" y="133" class="label">ClickHouse String JSON</text>
  <text x="672" y="160" class="text">保存压缩 String 文本</text>
  <rect x="845" y="100" width="220" height="84" rx="9" class="box"/>
  <text x="955" y="133" class="label">String data part</text>
  <text x="955" y="160" class="text">INSERT 后即可查询</text>
  <path d="M790 142 H845" class="arrow"/>
  <rect x="1120" y="90" width="235" height="104" rx="9" class="box"/>
  <text x="1237" y="124" class="label">字段或整文档读取</text>
  <text x="1237" y="151" class="text">字段查询时解析文本</text>
  <text x="1237" y="176" class="text">整文档直接读取 String</text>
  <path d="M1065 142 H1120" class="arrow"/>
  <rect x="1410" y="100" width="135" height="84" rx="9" class="box"/>
  <text x="1477" y="133" class="label">结果</text>
  <text x="1477" y="160" class="text">响应 bytes</text>
  <path d="M1355 142 H1410" class="arrow"/>

  <path d="M500 235 V342 H555" class="arrow"/>
  <rect x="555" y="290" width="235" height="104" rx="9" class="native"/>
  <text x="672" y="324" class="label">ClickHouse Native JSON</text>
  <text x="672" y="351" class="text">展开叶路径并识别值类型</text>
  <text x="672" y="376" class="text">Dynamic / Variant 表示</text>
  <rect x="845" y="268" width="250" height="148" rx="9" class="native"/>
  <text x="970" y="301" class="label">路径分配</text>
  <line x1="865" y1="317" x2="1075" y2="317" class="divider"/>
  <text x="970" y="343" class="text">type hint：固定类型子列</text>
  <text x="970" y="371" class="text">预算内：dynamic subcolumn</text>
  <text x="970" y="399" class="text">预算外：shared data</text>
  <path d="M790 342 H845" class="arrow"/>
  <rect x="1150" y="288" width="205" height="108" rx="9" class="box"/>
  <text x="1252" y="322" class="label">Native data part</text>
  <text x="1252" y="349" class="text">不可变零层 part</text>
  <text x="1252" y="374" class="text">每 part 独立应用预算</text>
  <path d="M1095 342 H1150" class="arrow"/>
  <rect x="1410" y="288" width="135" height="108" rx="9" class="box"/>
  <text x="1477" y="322" class="label">读取</text>
  <text x="1477" y="349" class="text">元数据定位</text>
  <text x="1477" y="374" class="text">子列或 shared</text>
  <path d="M1355 342 H1410" class="arrow"/>

  <rect x="25" y="485" width="1550" height="235" rx="12" class="panel"/>
  <text x="50" y="518" class="panel-title">B. data part 生命周期：后台 merge 与强制物理合并</text>
  <rect x="60" y="555" width="210" height="100" rx="9" class="box"/>
  <text x="165" y="590" class="label">多个 active parts</text>
  <text x="165" y="618" class="text">各自拥有路径集合</text>
  <text x="165" y="643" class="text">dynamic 并集可超过 32</text>
  <circle cx="315" cy="605" r="5" class="branch"/>
  <path d="M270 605 H315" class="connector"/>
  <path d="M315 605 V558 H365" class="arrow"/>
  <rect x="365" y="525" width="230" height="76" rx="9" class="merge"/>
  <text x="480" y="557" class="label">后台 merge</text>
  <text x="480" y="584" class="text">自动选择源 part</text>
  <path d="M315 605 V662 H365" class="arrow"/>
  <rect x="365" y="625" width="230" height="76" rx="9" class="merge"/>
  <text x="480" y="657" class="label">OPTIMIZE ... FINAL</text>
  <text x="480" y="684" class="text">请求强制物理合并</text>
  <circle cx="655" cy="613" r="5" class="branch"/>
  <path d="M595 563 H625 V608 H655" class="connector"/>
  <path d="M595 663 H625 V618 H655" class="connector"/>
  <rect x="715" y="558" width="220" height="110" rx="9" class="box"/>
  <text x="825" y="592" class="label">目标 data part</text>
  <text x="825" y="620" class="text">重写数据和统计</text>
  <text x="825" y="645" class="text">源 part 后续移除</text>
  <path d="M655 613 H715" class="arrow"/>
  <rect x="995" y="545" width="300" height="136" rx="9" class="native"/>
  <text x="1145" y="579" class="label">重新组织路径</text>
  <text x="1145" y="607" class="text">在容量上限内选择 dynamic</text>
  <text x="1145" y="632" class="text">其余路径进入 shared data</text>
  <text x="1145" y="657" class="text">本轮高频路径通常优先保留</text>
  <path d="M935 613 H995" class="arrow"/>
  <rect x="1355" y="558" width="180" height="110" rx="9" class="box"/>
  <text x="1445" y="592" class="label">可查询新 part</text>
  <text x="1445" y="620" class="text">物理组织已更新</text>
  <text x="1445" y="645" class="text">逻辑路径不丢失</text>
  <path d="M1295 613 H1355" class="arrow"/>

  <rect x="25" y="745" width="1550" height="175" rx="12" class="panel"/>
  <text x="50" y="778" class="panel-title">C. 读取语义：普通 SELECT 与 SELECT ... FINAL</text>
  <rect x="70" y="808" width="210" height="78" rx="9" class="box"/>
  <text x="175" y="839" class="label">当前 active parts</text>
  <text x="175" y="866" class="text">不改写磁盘数据</text>
  <circle cx="325" cy="847" r="5" class="branch"/>
  <path d="M280 847 H325" class="connector"/>
  <path d="M325 847 V817 H385" class="arrow"/>
  <rect x="385" y="790" width="220" height="70" rx="9" class="box"/>
  <text x="495" y="819" class="label">普通 SELECT</text>
  <text x="495" y="845" class="text">读取可见物理行</text>
  <rect x="680" y="790" width="270" height="70" rx="9" class="box"/>
  <text x="815" y="819" class="label">普通查询结果</text>
  <text x="815" y="845" class="text">可能包含跨 part 多版本</text>
  <path d="M605 825 H680" class="arrow"/>
  <path d="M325 847 V887 H385" class="arrow"/>
  <rect x="385" y="865" width="220" height="70" rx="9" class="box"/>
  <text x="495" y="894" class="label">SELECT ... FINAL</text>
  <text x="495" y="920" class="text">读取时应用引擎合并语义</text>
  <rect x="680" y="865" width="270" height="70" rx="9" class="box"/>
  <text x="815" y="894" class="label">FINAL 查询结果</text>
  <text x="815" y="920" class="text">本轮 ReplacingMergeTree 取新版本</text>
  <path d="M605 900 H680" class="arrow"/>
  <text x="1010" y="839" class="note">max_dynamic_paths=32 是每个 part 的容量上限，不是频率阈值。</text>
  <text x="1010" y="872" class="note">type hint 是手动固定路径；max_dynamic_types 约束单一路径的类型数量。</text>
  <text x="1010" y="905" class="note">SELECT FINAL 只改变读取语义；OPTIMIZE FINAL 位于上方，执行物理合并。</text>
</svg>
