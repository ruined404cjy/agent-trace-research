<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-labelledby="title desc">
  <title id="title">长载荷影响非载荷查询的两条途径</title>
  <desc id="desc">左侧为存放途径：列表读取的表是否含载荷字节，行存与列存的作用方式不同；右侧为并发途径：同时进行的载荷读写与列表争用共享资源，分表与外置分别切断哪一条途径。</desc>
  <defs>
    <style>
      .lane-bg { fill:#fbfcfe; stroke:#d7dee8; stroke-width:1.4; }
      .box { fill:#f7f9fc; stroke:#52657a; stroke-width:2; }
      .row { fill:#eef8f1; stroke:#397554; stroke-width:2; }
      .col { fill:#e8f1fb; stroke:#3a6896; stroke-width:2; }
      .load { fill:#fff3e6; stroke:#b86a1f; stroke-width:2; }
      .shared { fill:#f7effc; stroke:#75508e; stroke-width:2; }
      .title { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:25px; font-weight:700; fill:#1f2933; text-anchor:middle; }
      .lane-title { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:19px; font-weight:700; fill:#334155; }
      .label { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:16px; font-weight:700; fill:#1f2933; text-anchor:middle; }
      .text { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:14px; fill:#44515f; text-anchor:middle; }
      .note { font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size:14px; fill:#44515f; }
      .arrow { stroke:#52657a; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .arrow-load { stroke:#b86a1f; stroke-width:2.2; fill:none; marker-end:url(#arrow-load); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52657a"/>
    </marker>
    <marker id="arrow-load" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b86a1f"/>
    </marker>
  </defs>

  <rect width="1500" height="640" fill="#ffffff"/>
  <text x="750" y="42" class="title">长载荷影响列表与预览的两条途径：读放大与资源争用</text>

  <!-- 存放途径 -->
  <rect x="25" y="70" width="715" height="490" rx="12" class="lane-bg"/>
  <text x="50" y="104" class="lane-title">A. 读放大：列表读取的表里有载荷字节，取回同样的行要经过更多数据</text>
  <rect x="60" y="130" width="200" height="70" rx="9" class="box"/>
  <text x="160" y="160" class="label">列表 / 预览</text>
  <text x="160" y="184" class="text">payload 投影为 NULL</text>
  <path d="M260 165 L330 165" class="arrow"/>
  <rect x="335" y="130" width="380" height="70" rx="9" class="box"/>
  <text x="525" y="160" class="label">same_table 的 events</text>
  <text x="525" y="184" class="text">表内同时存有普通列与载荷</text>

  <rect x="60" y="230" width="315" height="300" rx="9" class="row"/>
  <text x="217" y="260" class="label">行存（openGauss、XStore）</text>
  <text x="217" y="292" class="text">按行组织，一页同时容纳各列</text>
  <text x="217" y="322" class="text">openGauss：大值压缩后移入 TOAST，</text>
  <text x="217" y="344" class="text">主行只留指针，heap 10.85 MB</text>
  <text x="217" y="374" class="text">XStore：载荷不压缩、存放在主表 heap 内，</text>
  <text x="217" y="396" class="text">heap 186.5 MB（窄表 11.0 MB）</text>
  <text x="217" y="430" class="text">按索引取 256 行：不受影响</text>
  <text x="217" y="454" class="text">回表过滤、顺序扫描、聚合：</text>
  <text x="217" y="476" class="text">经过的页随 heap 膨胀而增加</text>

  <rect x="400" y="230" width="315" height="300" rx="9" class="col"/>
  <text x="557" y="260" class="label">列存（ClickHouse）</text>
  <text x="557" y="292" class="text">按列组织，每列一个数据流</text>
  <text x="557" y="322" class="text">列裁剪：不投影 payload</text>
  <text x="557" y="344" class="text">就不读取 payload 列流</text>
  <text x="557" y="374" class="text">payload 列使 granule 更窄，</text>
  <text x="557" y="396" class="text">一页 keyset 读入的行更少</text>
  <text x="557" y="430" class="text">同表列表反而读得更少</text>
  <text x="557" y="454" class="text">merge 要重写含载荷的 part</text>

  <!-- 并发途径 -->
  <rect x="760" y="70" width="715" height="490" rx="12" class="lane-bg"/>
  <text x="785" y="104" class="lane-title">B. 资源争用：同时进行的载荷读写占用共享资源</text>
  <rect x="795" y="130" width="200" height="70" rx="9" class="load"/>
  <text x="895" y="160" class="label">批量恢复</text>
  <text x="895" y="184" class="text">循环读出全部载荷</text>
  <rect x="795" y="215" width="200" height="70" rx="9" class="load"/>
  <text x="895" y="245" class="label">大详情 / 长 Trace</text>
  <text x="895" y="269" class="text">单次读取 MiB 级载荷</text>
  <rect x="795" y="300" width="200" height="70" rx="9" class="load"/>
  <text x="895" y="330" class="label">持续写入</text>
  <text x="895" y="354" class="text">写入新载荷、触发 merge</text>
  <path d="M995 165 L1070 230" class="arrow-load"/>
  <path d="M995 250 L1070 250" class="arrow-load"/>
  <path d="M995 335 L1070 270" class="arrow-load"/>
  <rect x="1075" y="195" width="370" height="110" rx="9" class="shared"/>
  <text x="1260" y="230" class="label">同一数据库引擎的共享资源</text>
  <text x="1260" y="258" class="text">CPU、I/O、缓冲池、连接</text>
  <text x="1260" y="282" class="text">ClickHouse 另有解压与 merge</text>
  <path d="M1260 305 L1260 345" class="arrow"/>
  <rect x="1150" y="350" width="220" height="60" rx="9" class="box"/>
  <text x="1260" y="385" class="label">前台列表 / 预览</text>

  <text x="795" y="450" class="note">same_table：载荷读写与列表作用于同一张表</text>
  <text x="795" y="476" class="note">separate、full_core：换了表，仍在同一引擎内争用</text>
  <text x="795" y="502" class="note">asset_ref：载荷读取移到文件系统与客户端解析器</text>
  <text x="795" y="534" class="note">分表消除读放大；外置才把资源争用移出数据库</text>

  <text x="750" y="600" class="text">列表与预览都把 payload 投影为 NULL；预览只读取写入时预存的 200 字符 preview 列</text>
</svg>
